# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", ".github/actionlint.yaml", "packaging/**", "assets/app-icon/**", "docs/mcp.md", "docs/control-protocol.md", "docs/nightly-signing-policy.example.json", ".github/nightly-signing-policy.json", ".github/nightly-linux-signing-key.asc", "sonar-project.properties"]
  pull_request:
    paths: [".github/workflows/**", ".github/actionlint.yaml", "packaging/**", "assets/app-icon/**", "docs/mcp.md", "docs/control-protocol.md", "docs/nightly-signing-policy.example.json", ".github/nightly-signing-policy.json", ".github/nightly-linux-signing-key.asc", "sonar-project.properties"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@main
    with:
      extra-checks-script: packaging/linux/package-docs-test.sh

  verified-appimage-inputs:
    timeout-minutes: 10
    name: Verified AppImage inputs
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'artcraft-k8s-main' || 'ubuntu-latest' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash packaging/linux/verified-download-test.sh

  windows-install-policy:
    timeout-minutes: 10
    name: Windows installation policy (no app build)
    runs-on: windows-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned packaging toolchain
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'craft-install-policy-wix'
          dotnet tool install --tool-path $tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $tools >> $env:GITHUB_PATH
          $policy = Get-Content -Raw -LiteralPath packaging/windows/install-policy.json | ConvertFrom-Json
          foreach ($extension in @($policy.extensions)) {
            & (Join-Path $tools 'wix.exe') extension add -g "WixToolset.$extension.wixext/5.0.2"
            if ($LASTEXITCODE -ne 0) { throw "WiX extension $extension installation failed." }
          }
      - name: Build and check non-executable installer fixtures
        shell: pwsh
        run: ./packaging/windows/test-install-policy.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'craft-install-policy-tests')

  # Build the two requested MSI architectures on the development PR. This runs in the
  # active packaging workflow so it does not depend on the optional full CI workflow being enabled.
  windows-msi:
    name: Windows MSI (${{ matrix.arch }})
    needs: [windows-install-policy, lint]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'v1.0.1-develop' }}
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: D:\t
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: cc9269cd8d8258785dac603fba3122e5d2556795
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: ${{ matrix.target }}
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
      - name: Audit translation coverage and Windows startup policy
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          cargo xtask i18n-report
          cargo test -p photocraft-ui-egui --locked --lib complete_menu_catalogs_translate_every_menu_path_and_label
          cargo test -p photocraft --locked --bin photocraft gpu_startup
      - name: Build and validate MSI
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          DIST: ${{ github.workspace }}\dist\${{ matrix.arch }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -MsiOnly
      - name: Verify MSI-only output
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\${{ matrix.arch }}
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:DIST -File)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.msi') {
            throw "Expected exactly one MSI in $env:DIST; found: $($files.Name -join ', ')"
          }
          Write-Host "Validated MSI output: $($files[0].FullName)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photocraft-windows-msi-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*.msi
          if-no-files-found: error
          retention-days: 14

  nightly-source-contract:
    name: Nightly source contracts (no build or signing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce nightly serialization and synthetic packaging contracts
        run: python3 packaging/nightly-tests.py
