name: Windows MSI

on:
  push:
    branches: [v1.0.1-develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photocraft-windows-msi-v1.0.1-develop
  cancel-in-progress: true

jobs:
  windows-preflight:
    name: Windows preflight (Chinese menus and GPU startup)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.1-develop
          persist-credentials: false
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: cc9269cd8d8258785dac603fba3122e5d2556795
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: x86_64-pc-windows-msvc
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: windows-msi-x64
      - name: Audit translation coverage
        shell: pwsh
        run: cargo xtask i18n-report
      - name: Run Chinese menu regression tests
        shell: pwsh
        run: cargo test --locked --target x86_64-pc-windows-msvc -p photocraft-ui-egui --lib complete_menu_catalogs_translate_every_menu_path_and_label
      - name: Run Windows GPU startup regression tests
        shell: pwsh
        run: cargo test --locked --target x86_64-pc-windows-msvc -p photocraft --bin photocraft --features heif gpu_startup

  windows-msi:
    name: Windows MSI (${{ matrix.arch }})
    needs: windows-preflight
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.1-develop
          persist-credentials: false
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: cc9269cd8d8258785dac603fba3122e5d2556795
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: ${{ matrix.target }}
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: windows-msi-${{ matrix.arch }}
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
      - name: Build MSI only
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\${{ matrix.arch }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -MsiOnly
      - name: Verify MSI-only output
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\${{ matrix.arch }}
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:DIST -File)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.msi') {
            throw "Expected exactly one MSI in $env:DIST; found: $($files.Name -join ', ')"
          }
          Write-Host "Validated MSI output: $($files[0].FullName)"
      - name: Test real silent install, launch and uninstall
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\${{ matrix.arch }}
        run: |
          $msi = Get-ChildItem -LiteralPath $env:DIST -Filter '*.msi' -File | Select-Object -First 1
          if (-not $msi) { throw 'MSI was not produced.' }
          ./packaging/windows/test-msi-install.ps1 -MsiPath $msi.FullName -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photocraft-windows-msi-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*.msi
          if-no-files-found: error
          retention-days: 30
